# Base PostgreSQL locale de développement.
#
#   docker compose up -d      # ou : podman compose up -d
#   uv run alembic upgrade head
#
# Les identifiants sont lus dans `.env` (le même que celui des scripts Python),
# il n'y a donc qu'un seul endroit à renseigner. Les données survivent à un
# `down` ; `down -v` supprime le volume et repart d'une base vierge.
#
# **Changer d'image demande un REINDEX.** Le passage de `postgres:16` à
# `pgvector/pgvector:pg16` change la version de glibc, donc celle des collations,
# et PostgreSQL avertit alors que les index texte peuvent être mal ordonnés :
#
#   podman exec cahier-doleances-db psql -U $DB_USER -d $DB_NAME \
#     -c "REINDEX DATABASE $DB_NAME" \
#     -c "ALTER DATABASE $DB_NAME REFRESH COLLATION VERSION"
#
# À refaire dans l'autre sens si l'on revient à l'image de base.
services:
  db:
    # pgvector plutôt que `postgres:16` : l'extension `vector` n'est pas dans
    # l'image de base, et l'installer dans un conteneur en marche ne survit pas
    # à sa recréation. Cette image est `postgres:16` avec l'extension compilée
    # dedans — même version majeure, même format de répertoire de données : on
    # passe de l'une à l'autre sans toucher au volume.
    image: pgvector/pgvector:pg16
    container_name: cahier-doleances-db
    environment:
      POSTGRES_USER: ${DB_USER:?renseignez DB_USER dans .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?renseignez DB_PASSWORD dans .env}
      POSTGRES_DB: ${DB_NAME:?renseignez DB_NAME dans .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `uv run alembic upgrade head` juste après un `up -d` échouerait sinon :
      # Postgres accepte les connexions avant d'avoir fini son initialisation.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  pgdata:
