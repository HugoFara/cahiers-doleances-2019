[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cahier_doleances"
version = "0.1.0"
description = "Outil Data For Good pour visualiser et annoter les cahiers de doléances : contributions extraites des PDF, stockées en PostgreSQL et parcourues via une app Gradio."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.18.5",
    "click>=8.1.8",
    "duckdb>=1.1.3",
    "duckdb-engine>=0.15.0",
    "gradio>=6.19.0",
    "ipykernel>=6.29.5",
    "ipython>=8.31.0",
    "ipython-sql>=0.5.0",
    "jupysql>=0.10.17",
    "matplotlib>=3.10.0",
    "networkx>=3.6.1",
    "pandas>=2.2.3",
    "plotly>=6.9.0",
    "pymupdf>=1.25.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.1.0",
    "requests>=2.32.3",
    "sqlalchemy>=2.0.44",
    "tqdm>=4.68.0",
    "wordfreq>=3.1",
    "boto3>=1.43.68",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "ty"]

[tool.setuptools.packages.find]
include = ["database*", "extraction*", "gradio_app*"]

# Sans section [tool.ruff], le lint suit les règles par défaut de ruff, qui
# changent d'une version à l'autre : le repo passait en 0.15 et sortait 12
# erreurs en 0.16 sans qu'une ligne de code ait bougé. On fige donc l'intention.
# `I` (tri des imports) est ajouté aux défauts : corrigible automatiquement.
# topic-builder/ a sa propre config, plus stricte, dans son pyproject.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
# `topic-builder/` est un projet uv autonome (dépendances et lockfile séparés) :
# il se teste depuis son propre dossier, pas depuis la racine.
testpaths = ["extraction", "database", "gradio_app"]
pythonpath = ["."]
