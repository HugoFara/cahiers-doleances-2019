repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version. Les règles sont figées dans pyproject.toml : sans elles, les
    # défauts de ruff changent d'une version à l'autre et un simple autoupdate
    # fait rougir la CI sans qu'une ligne de code ait bougé.
    rev: "v0.16.0"
    hooks:
      # `ruff` seul est un alias legacy déprécié, remplacé par `ruff-check`.
      - id: ruff-check
        args: [--fix]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
